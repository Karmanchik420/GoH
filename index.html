<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Hoho</title>
</head>
<body style="background-color:rgb(0, 0, 0)"">
    <style>
    .page-img { display: block; margin: auto; }
    </style>
    <div id="pages"></div>
    <script>
    const chapter = 31;
    const pageCount = 12;
     document.getElementById("pages").innerHTML =
    Array.from({length: pageCount}, (_, i) =>
      `<img class="page-img" src="chapters/${chapter}/${i+1}.webp">`
    ).join("");
</script>
</body>
</html>
