<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Golden Hoho</title>
    <style>
    .page-img { 
        display: block;
        margin: auto;
        width: 100%;
        max-width: 793px;
    }
    .nav {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin: 20px 10px;
    }
    .nav a {
        padding: 15px 20px;
        border: 2px solid #b47501;
        font-size: clamp(18px, 4vw, 24px);
        white-space: nowrap;
        color: #ffa600;
    }
    .nav a:visited {
        color: #aa5916;
    }
    .nav a:hover {
        background-color: #ffa600;
        color: #000;
    }
    </style>
</head>
<body style="background-color:rgb(0, 0, 0)">
    <div id="pages"></div>
    <script>
        const chapters = {
            1: 18,
            2: 19,
            3: 12,
            4: 24,
            5: 6,
            6: 6,
            31: 12,
            32: 14,
            33: 12,
            34: 27,
            35: 13,
            36: 16,
            37: 14,
            38: 20,
            39: 16,
            40: 20,
            41: 16,
            42: 18,
            43: 17,
            44: 21,
            45: 15,
            46: 19,
            47: 21,
            48: 16,
            49: 16,
            50: 13,
            51: 14,
            52: 16,
            53: 17,
            54: 14,
            55: 18,
            56: 18,
            57: 18,
            58: 20,
            59: 9,
            60: 10,
            61: 9,
            62: 16,
            63: 19,
            64: 16,
            65: 14,
            66: 15,
            67: 19,
            68: 19,
            69: 19,
        }
        const chapter = parseInt(new URLSearchParams(location.search).get("ch")) || 1;
        const pageCount = chapters[chapter];
        document.getElementById("pages").innerHTML =
            Array.from({length: pageCount}, (_, i) =>
                `<img class="page-img" src="chapters/${chapter}/${i+1}.webp">`
            ).join("");
        
        const nextChapter = chapter + 1;
        const prevChapter = chapter - 1;

        const hasNext = nextChapter in chapters;
        const hasPrev = prevChapter in chapters;

        let navHTML = '<div class="nav">';
        if(hasPrev) {
            navHTML += `<a href="?ch=${prevChapter}">← Prev. chapter</a>`;
        }
        if(hasNext) {
            navHTML += `<a href="?ch=${nextChapter}">Next chapter →</a>`;
        }
        navHTML += '</div>';
        document.body.insertAdjacentHTML('afterbegin', navHTML);
        document.body.insertAdjacentHTML('beforeend', navHTML);
    </script>
</body>
</html>
